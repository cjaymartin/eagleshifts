[phases.setup]
nixPkgs = ["nodejs_20", "yarn"]

[phases.install]
cmds = ["yarn install"]

[phases.build]
cmds = ["NODE_OPTIONS='--max_old_space_size=2048' yarn build"]

[start]
cmd = "yarn start"

[variables]
NODE_ENV = "production"
NODE_OPTIONS = "--max_old_space_size=2048"

# Enable swap to help with memory-intensive operations
[phases.setup.aptPkgs]
keep = ["procps"]

[phases.setup.cmds]
cmds = ["fallocate -l 2G /swapfile", "chmod 600 /swapfile", "mkswap /swapfile", "swapon /swapfile"]
