[phases.setup]
nixpkgsArchive = "fe6cb717e302cec1a96f1942ddb4c44b89f7d2eb"
nixPkgs = ["nodejs_22", "yarn", "tzdata"]

[phases.install]
cmds = ["yarn install --production=true"]

[phases.build]
cmds = ["NODE_OPTIONS='--max_old_space_size=1024' yarn build"]

[start]
cmd = "yarn start"

[variables]
NODE_ENV = "production"
TZ = "America/New_York"

