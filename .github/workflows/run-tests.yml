name: Run Tests

# This workflow runs tests on pull requests and pushes to main/master branches
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'  # Match the Node.js version in package.json
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Upload test results
      if: always()  # Run this step even if previous steps fail
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          coverage/
          junit.xml
        if-no-files-found: ignore
